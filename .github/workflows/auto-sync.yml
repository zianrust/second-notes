name: Auto Sync Upstream

on:
  schedule:
    # Runs once a day. Adjust the cron expression if you want a different time.
    - cron: '0 6 * * *'
  workflow_dispatch: # "Run workflow" button for manual triggers

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags
          # A PAT is required so the push below triggers the Release workflow.
          # GITHUB_TOKEN pushes do not trigger further workflow runs.
          token: ${{ secrets.SYNC_PAT }}
          ref: main

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/inventory69/simple-notes-sync.git

      - name: Fetch upstream
        run: git fetch upstream --tags

      - name: Merge upstream changes
        run: |
          git merge upstream/main --no-edit -X ours

      - name: Drop workflows not used by this fork
        run: |
          for f in \
            .github/workflows/pr-build-check.yml \
            .github/workflows/weblate-build-check.yml \
            .github/workflows/weblate-merge.yml \
            .github/workflows/deploy-google-play.yml
          do
            rm -f "$f"
          done
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove upstream-only workflows not used by this fork"
          fi

      - name: Read version
        id: version
        run: |
          VERSION=$(grep 'versionName = ' android/app/build.gradle.kts | sed 's/.*versionName = "\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Upstream version: $VERSION"

      - name: Create or update the stable release tag on the merged commit
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="v${VERSION}"
          # Only tag stable releases (no -beta / pre-release suffix).
          if [[ "$TAG" == *-* ]]; then
            echo "Pre-release version ($TAG) - skipping tag creation"
            exit 0
          fi
          # Upstream ships a tag with the same name. Drop it locally so the tag
          # points at this fork's merged (customized) commit instead.
          git tag -d "$TAG" >/dev/null 2>&1 || true
          git tag "$TAG"
          echo "Tagged $TAG -> $(git rev-parse --short "$TAG")"

      - name: Push branch and stable tag (only if changed)
        run: |
          git push origin main
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="v${VERSION}"
          if [[ "$TAG" == *-* ]]; then
            echo "Pre-release version - skipping tag push"
            exit 0
          fi
          LOCAL_SHA=$(git rev-parse "$TAG")
          REMOTE_SHA=$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')
          if [ "$REMOTE_SHA" = "$LOCAL_SHA" ]; then
            echo "Tag $TAG already points at $LOCAL_SHA on origin - no push needed"
          else
            echo "Updating origin tag $TAG ($REMOTE_SHA -> $LOCAL_SHA)"
            git push origin "+$TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_PAT }}
