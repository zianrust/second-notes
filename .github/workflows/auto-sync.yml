name: Auto Sync Upstream

on:
  schedule:
    # Runs every day at 12:00 UTC. You can change this time if you want.
    - cron: '0 12 * * *'
  workflow_dispatch: # Adds a "Run workflow" button so you can trigger it manually

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history and tags
          token: ${{ secrets.SYNC_PAT }}

      - name: Add Upstream Remote
        run: git remote add upstream https://github.com/inventory69/simple-notes-sync.git

      - name: Fetch Upstream
        run: git fetch upstream

      - name: Merge Upstream Changes
        run: |
          git checkout main
          git merge upstream/main --no-edit || echo "No new changes to merge or merge conflict occurred"

      - name: Push Code and Tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin main
          git push origin --tags
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_PAT }}
